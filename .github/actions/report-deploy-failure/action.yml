name: Report deploy failure
description: Open, or comment on, the open deploy-smoke-failure issue for a failed deploy or post-deploy check.

inputs:
  sha:
    description: Commit that was being deployed.
    required: true
  title:
    description: Issue title prefix; the short SHA is appended.
    required: true
  summary:
    description: Opening words of the issue body, followed by the SHA and commit subject.
    required: true
  site-url:
    description: Site that was checked, if any.
    required: false
    default: ""
  rollback:
    description: Include git revert instructions ("true" when production may be broken).
    required: false
    default: "false"
  github-token:
    description: Token with issues write permission.
    required: true

runs:
  using: composite
  steps:
    - name: Open or update failure issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        OWNER: ${{ github.repository_owner }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SHA: ${{ inputs.sha }}
        TITLE: ${{ inputs.title }}
        SUMMARY: ${{ inputs.summary }}
        SITE_URL: ${{ inputs.site-url }}
        ROLLBACK: ${{ inputs.rollback }}
      # Logic lives in report.sh so scripts/report-deploy-failure.test.ts can run it.
      run: bash "${{ github.action_path }}/report.sh"
