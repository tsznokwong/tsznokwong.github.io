# This is a basic workflow to help you get started with Actions

name: Deployment
permissions:
  contents: read

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the development branch
on:
  push:
    branches: [development]

# Serialise deploy + verify so a newer deploy cannot overwrite the site while
# an older run is still waiting to observe its own SHA.
concurrency:
  group: deploy
  cancel-in-progress: false

# `npm run deploy` rebuilds via predeploy, so the SHA must be set workflow-wide.
env:
  VITE_BUILD_SHA: ${{ github.sha }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "deploy"
  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Setup Git
        run: |
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin https://tsznokwong:${{ secrets.DEPLOY_KEY }}@github.com/tsznokwong/tsznokwong.github.io.git

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: npm run deploy

  # verify is skipped when deploy fails, and App-made merges send failure email
  # to the App, so without this a failed deploy after auto-merge goes unnoticed.
  notify:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/report-deploy-failure
        with:
          sha: ${{ github.sha }}
          title: Deploy failed at
          summary: "Deploy job failed (production still serves the previous version) for"
          github-token: ${{ github.token }}

  verify:
    needs: deploy
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      expected_sha: ${{ github.sha }}
