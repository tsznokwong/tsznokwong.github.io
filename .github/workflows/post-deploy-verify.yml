name: Post-deploy verify

on:
  workflow_call:
    inputs:
      url:
        type: string
        default: https://tsznokwong.github.io
      expected_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      url:
        type: string
        default: https://tsznokwong.github.io
      expected_sha:
        type: string
        required: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ inputs.url }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployment to go live
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${SITE_URL}/?cb=${attempt}-$(date +%s)" | grep -q "name=\"build-sha\" content=\"${EXPECTED_SHA}\""; then
              echo "Live site serves ${EXPECTED_SHA}"
              exit 0
            fi
            echo "Attempt ${attempt}/30: ${EXPECTED_SHA} not live yet"
            sleep 20
          done
          echo "::error::${EXPECTED_SHA} did not go live within 10 minutes"
          exit 1

      - name: Run smoke tests against live site
        run: npm run smoke
        env:
          SMOKE_BASE_URL: ${{ inputs.url }}
          SMOKE_EXPECTED_SHA: ${{ inputs.expected_sha }}

      - name: Open or update failure issue
        if: failure()
        uses: ./.github/actions/report-deploy-failure
        with:
          sha: ${{ inputs.expected_sha }}
          title: Post-deploy smoke failed at
          summary: Post-deploy verification failed for
          site-url: ${{ inputs.url }}
          rollback: "true"
          github-token: ${{ github.token }}
