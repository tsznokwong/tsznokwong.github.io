# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    # Wait before proposing new releases: most compromised or broken versions
    # are yanked within days, and auto-merge ships straight to production.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    # Only packages that must move together; everything else stays one PR per
    # package so a bad update is a single-commit revert.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
    ignore:
      # Types must match the runtime pinned in .nvmrc; bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Never auto-merged (scripts/automerge-eligible.ts): these run beside the
  # App and deploy secrets. See docs/adr/0008.
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    pull-request-branch-name:
      separator: "/"
    cooldown:
      default-days: 7
